<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TerraX69JS</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    @font-face {
      font-family: gamefont;
      src: url(src/assets/fonts/ModerDOS437.ttf);
    }

    * {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #111;
      min-height: 100vh;
      font-family: 'gamefont', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    .start-menu {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      /*background: radial-gradient(circle at 50%, #181818, #000);*/
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .start-menu h1 {
      font-size: 4em;
      color: #f0db4f;
      margin-bottom: 40px;
      text-transform: uppercase;
      letter-spacing: 5px;
      text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.6);
    }

    .buttons-menu {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .buttons-menu button {
      font-size: 1.5em;
      min-width: 300px;
      height: 70px;
      padding: 10px;
      background-color: transparent;
      border: 2px solid #fff;
      border-radius: 10px;
      color: #fff;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(255, 255, 255, 0.2);
    }

    .buttons-menu button:hover {
      background-color: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
      box-shadow: 0 6px 15px rgba(255, 255, 255, 0.4);
    }

    .buttons-menu button:active {
      transform: translateY(4px);
    }

    .starwars-3d-effect {
      animation: starwars-effect 2s alternate-reverse;
    }

    @keyframes starwars-effect {
      0% {
        transform: perspective(50em) rotateX(0deg);
      }
      100% {
        transform: perspective(75em) rotateX(90deg);
      }
    }

    .quad-tile-background {
      background: #181818;
      background-size: 64px 64px;
      background-position: -1px -1px;
      background-image: linear-gradient(90deg, rgba(0, 0, 0, 0.4) 1px, transparent 0),
        linear-gradient(180deg, rgba(0, 0, 0, 0.4) 1px, transparent 0);
      border: 1px solid #2b2b2b;
    }
  </style>

</head>

<body>
